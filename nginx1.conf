server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # ACME challenge (Let's Encrypt)
    location ^~ /.well-known/acme-challenge/ {
        set $host_without_www $host;
        if ($host ~* ^www\.(.*)$) {
            set $host_without_www $1;
        }

        root /app/ssl-folder/$host_without_www;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name *.storye.site;
    rewrite ^/(.*)/$ /$1 permanent;
    listen 443 ssl;
    listen [::]:443 ssl;

    root /app/ssl-folder/$cert_folder;

    set $sslfolder storye.site;

    proxy_intercept_errors on;

    # ✅ FIX: DNS resolver using your Kubernetes CoreDNS + Google fallback
    resolver 10.96.0.10 8.8.8.8 valid=30s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $baseurl https://assets.projectwhite.space;
        set $target_folder $cert_folder;

        # ✅ FIX: Initialize variables to avoid "uninitialized" warnings
        set $temp_cache "";
        set $temp_cache1 "";

        # if host starts with www.
        if ($host ~* ^www\.) {
            set $target_folder www.$cert_folder;
        }

        if ($request_uri ~ ^(.*/)/($|\?.*)) {
            return 301 $1$2;
        }

        if ($host = 'app.storye.site') {
            set $temp_cache1 4$temp_cache1;
        }

        if ($request_uri ~ .*v1.*) {
            set $temp_cache1 5$temp_cache1;
        }

        if ($request_uri ~ .*locales.*) {
            set $temp_cache1 5$temp_cache1;
        }

        if ($host != 'storye.site') {
            set $temp_cache 1$temp_cache;
        }

        if ($uri = '/') {
            set $temp_cache 1$temp_cache;
        }

        if ($temp_cache = 11) {
            proxy_pass $baseurl/$target_folder/$target_folder;
            break;
        }

        if ($temp_cache = 1) {
            proxy_pass $baseurl/$target_folder$request_uri;
        }
    }

    location /error.html {
        proxy_pass https://storage.googleapis.com/cur_data_storage/error.html;
    }

    ssl_certificate /etc/letsencrypt/live/$cert_folder/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$cert_folder/privkey.pem;
}